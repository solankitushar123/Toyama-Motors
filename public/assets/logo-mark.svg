<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="badgeClip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>

  <circle cx="100" cy="100" r="98" fill="#0F172A"/>
  <circle cx="100" cy="100" r="96" fill="#0B1220" stroke="#B3272B" stroke-width="1.5"/>

  <g clip-path="url(#badgeClip)">
    <!-- rising sun rays -->
    <g fill="#B3272B">
      <polygon points="100,150 60,10 80,10"/>
      <polygon points="100,150 92,6 108,6"/>
      <polygon points="100,150 120,10 140,10"/>
      <polygon points="100,150 30,30 48,18"/>
      <polygon points="100,150 152,18 170,30"/>
