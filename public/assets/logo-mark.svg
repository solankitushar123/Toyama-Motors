      <rect x="-2" y="17" width="54" height="7" rx="2" fill="#B3272B"/>
      <circle cx="10" cy="25" r="5" fill="#0B1220"/>
      <circle cx="40" cy="25" r="5" fill="#0B1220"/>
    </g>

    <!-- sakura blossoms -->
    <g fill="#F7F8FA">
      <g transform="translate(34,32) scale(0.55)">
        <circle cx="0" cy="-9" r="7"/>
        <circle cx="8.5" cy="-3" r="7"/>
        <circle cx="5.2" cy="7" r="7"/>
        <circle cx="-5.2" cy="7" r="7"/>
        <circle cx="-8.5" cy="-3" r="7"/>
        <circle cx="0" cy="0" r="4.5" fill="#B3272B"/>
      </g>
      <g transform="translate(164,34) scale(0.5)">
        <circle cx="0" cy="-9" r="7"/>
        <circle cx="8.5" cy="-3" r="7"/>
        <circle cx="5.2" cy="7" r="7"/>
        <circle cx="-5.2" cy="7" r="7"/>
        <circle cx="-8.5" cy="-3" r="7"/>
        <circle cx="0" cy="0" r="4.5" fill="#B3272B"/>
      </g>
      <g transform="translate(56,170) scale(0.42)">
        <circle cx="0" cy="-9" r="7"/>
        <circle cx="8.5" cy="-3" r="7"/>
        <circle cx="5.2" cy="7" r="7"/>
        <circle cx="-5.2" cy="7" r="7"/>
        <circle cx="-8.5" cy="-3" r="7"/>
        <circle cx="0" cy="0" r="4.5" fill="#B3272B"/>
      </g>
      <g transform="translate(148,168) scale(0.42)">
        <circle cx="0" cy="-9" r="7"/>
        <circle cx="8.5" cy="-3" r="7"/>
        <circle cx="5.2" cy="7" r="7"/>
        <circle cx="-5.2" cy="7" r="7"/>
        <circle cx="-8.5" cy="-3" r="7"/>
