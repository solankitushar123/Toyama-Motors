    <g fill="#F7F8FA">
      <polygon points="100,150 76,10 92,8"/>
      <polygon points="100,150 108,8 124,10"/>
      <polygon points="100,150 44,20 62,12"/>
      <polygon points="100,150 138,12 156,20"/>
    </g>

    <!-- sun disc -->
    <circle cx="100" cy="118" r="30" fill="#B3272B"/>

    <!-- Mt Fuji silhouette -->
    <polygon points="30,150 78,84 92,100 100,88 108,100 122,84 170,150" fill="#F7F8FA"/>
    <polygon points="78,84 92,100 100,88 96,94 84,96" fill="#0B1220" opacity="0.14"/>
    <polygon points="122,84 108,100 100,88 104,94 116,96" fill="#0B1220" opacity="0.14"/>

    <!-- base line / road -->
    <rect x="18" y="150" width="164" height="5" fill="#F7F8FA"/>
    <rect x="18" y="157" width="164" height="2.5" fill="#B3272B"/>

